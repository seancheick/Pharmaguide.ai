name: pharmaguide
description: "PharmaGuide — Scan, score, and stack supplements safely"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  # Navigation
  go_router: ^14.0.0
  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # Supabase
  supabase_flutter: ^2.5.0
  # Barcode scanning
  mobile_scanner: ^5.1.0
  # Sharing
  share_plus: ^9.0.0
  # Secure storage
  flutter_secure_storage: ^9.2.0
  # Connectivity
  connectivity_plus: ^6.0.0
  # Local storage (guest scan limits)
  shared_preferences: ^2.3.0
  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  # URL launching (clinical citations, FDA links)
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter_native_splash:
  color: "#0A7D6F"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0A7D6F"
    image: assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0A7D6F"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/reference_data/
    - assets/images/
    # Catalog bundle — produced by the DSLD pipeline release bridge
    # (scripts/import_catalog_artifact.sh). Contains the full SQLite
    # products_core snapshot the app copies to documents on first launch.
    # *.db is tracked via Git LFS; see .gitattributes.
    - assets/db/pharmaguide_core.db
    - assets/db/export_manifest.json
