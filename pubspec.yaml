name: pharmaguide
description: "PharmaGuide — Scan, score, and stack supplements safely"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  sentry_flutter: ^9.20.0
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0
  # Navigation
  go_router: ^17.0.0
  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # Supabase
  supabase_flutter: ^2.5.0
  # Barcode scanning
  mobile_scanner: ^7.2.0
  # Sharing
  share_plus: ^13.1.0
  # Connectivity
  connectivity_plus: ^6.0.0
  # Local storage (guest scan limits)
  shared_preferences: ^2.3.0
  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  http: ^1.2.1
  shimmer: ^3.0.0
  # URL launching (clinical citations, FDA links)
  url_launcher: ^6.2.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0
  mockito: ^5.4.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  # P4 (release-safety verify-bundle) — used by scripts/verify_bundle.dart
  # to compute SHA256, query the bundled SQLite catalog, and parse CLI args.
  # http is already in `dependencies`. test/ uses flutter_test.
  sqlite3: ^2.0.0
  crypto: ^3.0.0
  args: ^2.4.0

flutter_native_splash:
  color: "#0A7D6F"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0A7D6F"
    image: assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0A7D6F"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/reference_data/
    - assets/images/
    # Catalog bundle — produced by the DSLD pipeline release bridge
    # (scripts/import_catalog_artifact.sh). Contains the full SQLite
    # products_core snapshot the app copies to documents on first launch.
    # *.db and *.sqlite are tracked via Git LFS; see .gitattributes.
    - assets/db/pharmaguide_core.db
    - assets/db/export_manifest.json
    # Interaction DB bundle — produced by the pipeline's
    # release_interaction_artifact.py. Read-only Drift database that
    # powers stack/medication interaction warnings (M3-M5). Coexists
    # with the catalog DB; both are bundled as static assets and
    # opened directly without copying to app documents.
    - assets/db/interaction_db.sqlite
    - assets/db/interaction_db_manifest.json
    # Functional-roles vocab — clinician-locked v1.0.0 controlled
    # vocabulary for inactive-ingredient tap-to-explain modals. 32
    # roles, ~13 KB. Bundled (not per-blob) so vocab updates ship via
    # app release. Source of truth: pipeline repo
    # `scripts/data/functional_roles_vocab.json`.
    - assets/data/functional_roles_vocab.json
    # Verdict vocab — locked v1.0.0, 6 shipped IDs
    # (SAFE/CAUTION/POOR/BLOCKED/UNSAFE/NUTRITION_ONLY).
    # Display contract for product verdicts (name + short_label + tone +
    # ui_color + ui_icon + action). Single source of truth for verdict
    # presentation across verdict_badge, alert_summary_card, banner,
    # and score_breakdown_card. Source: pipeline `scripts/data/verdict_vocab.json`.
    - assets/data/verdict_vocab.json
    # Severity vocab — locked v1.0.0, 6 IDs (contraindicated/avoid/caution/
    # monitor/informational/safe). Display contract for severity tiers
    # used by interaction-rule warnings, harmful-additive flags, and
    # allergen alerts. Source: pipeline `scripts/data/severity_vocab.json`.
    - assets/data/severity_vocab.json
    # Condition vocab — locked v1.0.0, 14 IDs (pregnancy, lactation, ttc,
    # surgery_scheduled, hypertension, etc.). Lean schema (id+name+notes+
    # optional synonyms+icd10). Migrated from hardcoded conditionLabels in
    # schema_ids.dart. Source: pipeline `scripts/data/condition_vocab.json`.
    - assets/data/condition_vocab.json
    # Drug-class vocab — locked v1.0.0, 21 IDs (13 user_selectable + 8
    # rule-only CYP/narrow families). Carries name, notes, examples,
    # rx_status, user_selectable. 13 user_selectable match drugClasses in
    # schema_ids.dart. Source: pipeline `scripts/data/drug_class_vocab.json`.
    - assets/data/drug_class_vocab.json
    # User-goals vocab — locked v1.0.0, 18 IDs (GOAL_SLEEP_QUALITY,
    # GOAL_REDUCE_STRESS_ANXIETY, etc.). Lean schema + extras: name, notes,
    # priority, related_condition_ids, related_drug_class_ids. Migrated from
    # hardcoded goalLabels + goalPriorities in schema_ids.dart. Cluster
    # mapping stays in user_goals_to_clusters.json. Source: pipeline
    # `scripts/data/user_goals_vocab.json`.
    - assets/data/user_goals_vocab.json
    # Evidence-level vocab — locked v1.0.0, 5 clinical-study design tiers
    # from backed_clinical_studies.json. Source: pipeline
    # `scripts/data/evidence_level_vocab.json`.
    - assets/data/evidence_level_vocab.json
    # Evidence-strength vocab — locked v1.0.0, 6 interaction-rule strength
    # tiers. Source data field is still evidence_level; separate asset name
    # prevents conflating rule strength with clinical-study design.
    # Source: pipeline `scripts/data/evidence_strength_vocab.json`.
    - assets/data/evidence_strength_vocab.json
    # Study-type vocab — locked v1.0.0, 7 clinical study-design categories
    # with scoring base points. Source: pipeline
    # `scripts/data/study_type_vocab.json`.
    - assets/data/study_type_vocab.json
    # Clinical-indication vocab — locked v1.0.0, 22 categories used by
    # backed_clinical_studies for evidence grouping in Flutter UI.
    # Source: pipeline `scripts/data/clinical_indication_vocab.json`.
    - assets/data/clinical_indication_vocab.json
    # IQM category vocab — locked v1.0.0, 12 parent-category buckets for
    # ingredient_quality_map's 621+ active-ingredient parents.
    # Source: pipeline `scripts/data/iqm_category_vocab.json`.
    - assets/data/iqm_category_vocab.json
    # Banned-status vocab — locked v1.0.0, 4 IDs (banned/recalled/
    # high_risk/watchlist). Display contract for B0-gate alerts.
    # Source: pipeline `scripts/data/banned_status_vocab.json`.
    - assets/data/banned_status_vocab.json
    # Clinical-risk vocab — locked v1.0.0, 5 IDs (critical/high/moderate/
    # dose_dependent/low). Display contract for clinical_risk_enum tier.
    # Source: pipeline `scripts/data/clinical_risk_vocab.json`.
    - assets/data/clinical_risk_vocab.json
    # Legal-status vocab — locked v1.0.0, 10 IDs (regulatory classifications:
    # not_lawful_as_supplement, adulterant, banned_federal, etc.).
    # Source: pipeline `scripts/data/legal_status_vocab.json`.
    - assets/data/legal_status_vocab.json
    # Ban-context vocab — locked v1.0.0, 5 IDs (substance/adulterant_in_
    # supplements/contamination_recall/watchlist/export_restricted).
    # Source: pipeline `scripts/data/ban_context_vocab.json`.
    - assets/data/ban_context_vocab.json
    # Effect-direction vocab — locked v1.0.0, 5 IDs (positive_strong/
    # positive_weak/mixed/null/negative). Multipliers verified against
    # scoring_config.json. Source: pipeline `scripts/data/effect_direction_vocab.json`.
    - assets/data/effect_direction_vocab.json
    # Signal-strength vocab — locked v1.0.0, 3 IDs (strong/moderate/weak)
    # for CAERS adverse-event signals. Display contract; scoring layer
    # currently disabled per V1.1 ROADMAP §5.1.
    # Source: pipeline `scripts/data/signal_strength_vocab.json`.
    - assets/data/signal_strength_vocab.json
    # Allergen-prevalence vocab — locked v1.0.0, 3 IDs (high/moderate/low).
    # Display contract for allergen prevalence chip.
    # Source: pipeline `scripts/data/allergen_prevalence_vocab.json`.
    - assets/data/allergen_prevalence_vocab.json
    # Allergen-regulatory-status vocab — locked v1.0.0, 3 IDs (fda_major/
    # eu_major/eu_allergen). Lean schema.
    # Source: pipeline `scripts/data/allergen_regulatory_status_vocab.json`.
    - assets/data/allergen_regulatory_status_vocab.json
    # Manufacturer-trust-tier vocab — locked v1.0.0, 4 IDs (trusted/neutral/
    # violations_minor/violations_critical). Display contract; tier is
    # computed from top_manufacturers_data + manufacturer_violations join.
    # Source: pipeline `scripts/data/manufacturer_trust_tier_vocab.json`.
    - assets/data/manufacturer_trust_tier_vocab.json
    # EFSA-status vocab — locked v1.0.0, 10 IDs from EFSA OpenFoodTox.
    # Source: pipeline `scripts/data/efsa_status_vocab.json`.
    - assets/data/efsa_status_vocab.json
    # EFSA-genotoxicity vocab — locked v1.0.0, 7 IDs (negative/positive/
    # equivocal/insufficient_data/indirect/cannot_be_excluded/under_review).
    # Source: pipeline `scripts/data/efsa_genotoxicity_vocab.json`.
    - assets/data/efsa_genotoxicity_vocab.json
    # Match-mode vocab — locked v1.0.0, 3 IDs (active/disabled/historical)
    # for banned_recalled_ingredients rule-engine state.
    # Source: pipeline `scripts/data/match_mode_vocab.json`.
    - assets/data/match_mode_vocab.json
    # Confidence-tier vocab — locked v1.0.0, 3 IDs (high/medium/low) used
    # in harmful_additives + clinical_studies. Display contract.
    # Source: pipeline `scripts/data/confidence_tier_vocab.json`.
    - assets/data/confidence_tier_vocab.json
    # Score-contribution-tier vocab — locked v1.0.0, 3 IDs (tier_1/tier_2/
    # tier_3) for backed_clinical_studies score brackets. Display contract.
    # Source: pipeline `scripts/data/score_contribution_tier_vocab.json`.
    - assets/data/score_contribution_tier_vocab.json
    # Primary-outcome vocab — locked v1.0.0, 15 IDs for backed_clinical_studies
    # primary_outcome categories. Snake_case canonical IDs + legacy_display
    # for round-trip lookup until v1.1 source-data migration.
    # Source: pipeline `scripts/data/primary_outcome_vocab.json`.
    - assets/data/primary_outcome_vocab.json
    # form_factor vocab (SP-3, 2026-05-21): 18 canonical product
    # physical-state buckets covering DSLD's 10 langual codes plus
    # finer-grain forms (softgel split from capsule, sublingual from
    # lozenge, tincture from liquid, etc.).
    # Source: pipeline `scripts/data/form_factor_vocab.json`.
    - assets/data/form_factor_vocab.json

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: pharmaguide
  org: bbr-technology
