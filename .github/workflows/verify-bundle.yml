name: Verify Bundle

# Independent second-line defense against the 2026-05-12 failure mode
# (ADR-0001 P4). Runs the consumer-side bundle verifier
# (scripts/verify_bundle.dart) against real Supabase storage on any PR
# that modifies the bundled catalog.
#
# Setup required before this workflow can run:
#   - SUPABASE_URL repo secret
#   - SUPABASE_ANON_KEY repo secret
# The anon key is the public app key — it's stored as a secret to keep
# it out of workflow logs, not because it's secret per se. If either
# secret is missing the job fails fast with a clear message.
#
# Manual trigger (workflow_dispatch) is supported so operators can
# verify the live bundle on demand without opening a PR.

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/db/**'
      - 'scripts/verify_bundle.dart'
      - '.github/workflows/verify-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'assets/db/**'
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Number of products to sample'
        required: false
        default: '20'

concurrency:
  group: verify-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bundle:
    name: Bundle ↔ Supabase storage alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on Dependabot PRs. GitHub deliberately withholds repo
    # secrets from dependabot[bot] PRs to prevent secret leakage
    # via malicious dependency updates — so SUPABASE_URL /
    # SUPABASE_ANON_KEY are unavailable and the "Fail fast if
    # Supabase secrets are missing" step would always fail.
    # Dependabot PRs that touch this workflow file (e.g. an
    # actions/checkout bump) match the path filter above, then
    # the job 100% fails. Dep updates can't change the bundle
    # anyway; the regular CI workflow validates the bump on its
    # own. Re-run via workflow_dispatch after merging if the bump
    # touched anything bundle-adjacent. Added in PR 9 iteration.
    if: github.actor != 'dependabot[bot]'

    steps:
      # Check out the committed LFS pointer without downloading its object.
      # The job below proves that pointer, the committed manifest, and the
      # canonical Supabase catalog all identify the same immutable bytes.
      # This keeps the release gate meaningful when GitHub LFS is unavailable.
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Fail fast if Supabase secrets are missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repo secrets are required"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Materialize committed catalog from Supabase storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          manifest="assets/db/export_manifest.json"
          pointer="assets/db/pharmaguide_core.db"
          verification_db="$RUNNER_TEMP/pharmaguide_core.db"

          db_version="$(jq -er '.db_version' "$manifest")"
          expected_sha="$(jq -er '.checksum_sha256' "$manifest")"
          pointer_sha="$(sed -n 's/^oid sha256://p' "$pointer")"

          if [ -z "$pointer_sha" ] || [ "$pointer_sha" != "$expected_sha" ]; then
            echo "::error::Committed catalog LFS pointer does not match export_manifest.json"
            exit 1
          fi

          storage_url="${SUPABASE_URL%/}/storage/v1/object/authenticated/pharmaguide/v${db_version}/pharmaguide_core.db"
          curl --fail --silent --show-error --location --retry 3 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --output "$verification_db" \
            "$storage_url"

          actual_sha="$(sha256sum "$verification_db" | awk '{print $1}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Supabase catalog checksum does not match the committed manifest"
            exit 1
          fi

          echo "VERIFICATION_DB=$verification_db" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify bundle against Supabase storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '20' }}
        run: |
          dart run scripts/verify_bundle.dart \
            --manifest assets/db/export_manifest.json \
            --db "$VERIFICATION_DB" \
            --supabase-url "$SUPABASE_URL" \
            --anon-key "$SUPABASE_ANON_KEY" \
            --sample-size "$SAMPLE_SIZE"
