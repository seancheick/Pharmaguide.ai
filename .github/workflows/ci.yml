name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Only pharmaguide_core.db still ships via Git LFS. interaction_db.sqlite
      # was migrated OUT of LFS to a versioned GitHub Release asset (hydrated
      # below). `lfs: false` keeps checkout from being a hard gate: when the
      # LFS fetch fails the whole job would otherwise die before
      # analyze/test/format ever run, turning every PR red for a reason
      # unrelated to the code under review.
      - uses: actions/checkout@v7
        with:
          lfs: false

      # interaction_db.sqlite is distributed as a versioned GitHub Release asset
      # (not Git LFS). Hydrate + verify it BEFORE analyze/test/package.
      # fetch_interaction_db.sh fails closed on a bad checksum, header, size, or
      # a missing/hazardous drug_class_map — a broken DB or a 133-byte LFS
      # pointer can never reach the test or package steps.
      - name: Hydrate interaction DB (release asset)
        run: bash tool/fetch_interaction_db.sh

      - name: Validate hydration fail-closed logic
        run: bash test/tool/fetch_interaction_db_test.sh

      # Fetch the LFS objects (only pharmaguide_core.db now) best-effort and
      # record whether we got them. The catalog-DB tests are tagged `bundle`
      # (see dart_test.yaml) and are excluded when the object is unavailable;
      # analyze, format, and the rest of the suite run either way. When the LFS
      # budget is restored this step simply succeeds and the catalog gates run
      # again — no workflow change.
      - name: Fetch LFS objects (best effort)
        run: |
          git lfs install --local
          git lfs pull || true
          # Check the postcondition, not git-lfs's exit code: a real
          # SQLite file starts with "SQLite format 3", an unfetched LFS
          # pointer starts with "version https://git-lfs...".
          if head -c 15 assets/db/pharmaguide_core.db | grep -qa 'SQLite format'; then
            echo "EXCLUDE_TAGS=golden" >> "$GITHUB_ENV"
            echo "Git LFS objects materialized — bundle-dependent tests will run."
          else
            echo "EXCLUDE_TAGS=golden,bundle" >> "$GITHUB_ENV"
            echo "::warning title=Git LFS unavailable::Could not fetch assets/db LFS objects (LFS budget exceeded). Bundle-dependent release gates were SKIPPED, not verified."
            {
              echo "## ⚠️ Bundle release gates skipped"
              echo ""
              echo "Git LFS objects for \`assets/db/\` could not be fetched, so tests tagged"
              echo "\`bundle\` did not run. **This job passing does not mean the shipped"
              echo "catalog was verified.** Restore the repo's LFS budget to re-enable them."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift schema + JSON serialization generated code (*.g.dart) is
      # gitignored locally — `flutter analyze` finds 455 errors without
      # it ("Undefined class 'UserStacksLocalData'", "ProductsCoreCompanion",
      # etc.). Run build_runner before analyze so CI matches the local
      # `make gen && make check` flow.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests (with coverage)
        # Runs every test directory except test/fixtures/ (test data,
        # not tests). Golden tests in test/core/widgets/goldens/ are
        # excluded via --exclude-tags because font rendering differs
        # across platforms (Ubuntu CI vs macOS dev). $EXCLUDE_TAGS adds
        # `bundle` when the LFS step above could not materialize
        # assets/db — see that step for why.
        # --coverage writes coverage/lcov.info; the next step parses it.
        run: flutter test --coverage --exclude-tags "$EXCLUDE_TAGS" test/core/ test/services/ test/features/ test/release_gate/ test/data/ test/scripts/ test/safety_invariants/ test/safety/

      - name: Coverage summary
        # Parses coverage/lcov.info to compute line coverage across all
        # source files reported by flutter test. Surfaces as a GitHub
        # check-summary block (markdown) so the number is visible on
        # the PR without leaving a comment or pulling in codecov.
        # No install needed — awk + bash. PR 9 (CI hygiene).
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — tests may have failed before generating it."
            exit 0
          fi
          read -r LH LF <<< "$(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END    { print lh, lf }
          ' coverage/lcov.info)"
          if [ "$LF" -eq 0 ]; then
            PCT="n/a"
            LINE="Coverage: no lines reported in lcov.info"
          else
            PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { printf "%.1f", (lh/lf)*100 }')
            LINE="Coverage: ${PCT}% (${LH} / ${LF} lines)"
          fi
          echo "$LINE"
          {
            echo "## Test coverage"
            echo ""
            echo "**${LINE}**"
            echo ""
            echo "_CI-scoped: all test dirs except \`test/fixtures/\` (golden tests excluded via tag)._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep new work formatted without turning an SDK formatter upgrade into
      # an unrelated whole-repository rewrite. Generated .g.dart files remain
      # excluded. The base SHA is fetched explicitly because checkout is shallow.
      - name: Check changed Dart formatting
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="${GITHUB_SHA}^"
          fi
          git fetch --no-tags --depth=1 origin "$base_sha"
          dart_files=()
          while IFS= read -r -d '' file; do
            dart_files+=("$file")
          done < <(
            git diff --name-only --diff-filter=ACMRT -z \
              "$base_sha" "$GITHUB_SHA" -- \
              ':(glob)lib/**/*.dart' \
              ':(glob)test/**/*.dart' \
              ':(exclude,glob)**/*.g.dart'
          )
          if ((${#dart_files[@]} == 0)); then
            echo "No changed hand-written Dart files."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
