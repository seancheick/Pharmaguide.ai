name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The catalog DBs (assets/db/*.db, *.sqlite) ship via Git LFS —
      # actions/checkout@v4 fetches LFS pointer files by default, which
      # causes downstream sqlite3 calls to fail with
      # "file is not a database". 26 of the data-layer tests depend on
      # the real bundle. Set lfs: true to materialize the actual files.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift schema + JSON serialization generated code (*.g.dart) is
      # gitignored locally — `flutter analyze` finds 455 errors without
      # it ("Undefined class 'UserStacksLocalData'", "ProductsCoreCompanion",
      # etc.). Run build_runner before analyze so CI matches the local
      # `make gen && make check` flow.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test test/services/ test/features/ test/release_gate/ test/data/

      # Exclude .g.dart files — they're auto-generated by build_runner
      # and the formatter rules drift between Dart minor versions, so
      # locking them to one specific format would just churn on every
      # SDK bump. The hand-written sources in lib/ + test/ get the
      # full check.
      - name: Check formatting
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' -print0 \
            | xargs -0 dart format --set-exit-if-changed
