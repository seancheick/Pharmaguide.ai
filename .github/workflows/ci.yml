name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The catalog DBs (assets/db/*.db, *.sqlite) ship via Git LFS —
      # actions/checkout@v6 fetches LFS pointer files by default, which
      # causes downstream sqlite3 calls to fail with
      # "file is not a database". 26 of the data-layer tests depend on
      # the real bundle. Set lfs: true to materialize the actual files.
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift schema + JSON serialization generated code (*.g.dart) is
      # gitignored locally — `flutter analyze` finds 455 errors without
      # it ("Undefined class 'UserStacksLocalData'", "ProductsCoreCompanion",
      # etc.). Run build_runner before analyze so CI matches the local
      # `make gen && make check` flow.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests (with coverage)
        # P4.1 (release-safety verifier) lives in test/scripts/; include
        # it so the verifier's unit tests run on every PR. Real Supabase
        # is not touched — the tests mock the HTTP layer.
        # test/safety_invariants/ is the medical-safety gate for the
        # self-healing loop — see knowledge/sentry-autofix-playbook.md.
        # --coverage writes coverage/lcov.info; the next step parses it.
        run: flutter test --coverage test/services/ test/features/ test/release_gate/ test/data/ test/scripts/ test/safety_invariants/

      - name: Coverage summary
        # Parses coverage/lcov.info to compute line coverage across all
        # source files reported by flutter test. Surfaces as a GitHub
        # check-summary block (markdown) so the number is visible on
        # the PR without leaving a comment or pulling in codecov.
        # No install needed — awk + bash. PR 9 (CI hygiene).
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — tests may have failed before generating it."
            exit 0
          fi
          read -r LH LF <<< "$(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END    { print lh, lf }
          ' coverage/lcov.info)"
          if [ "$LF" -eq 0 ]; then
            PCT="n/a"
            LINE="Coverage: no lines reported in lcov.info"
          else
            PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { printf "%.1f", (lh/lf)*100 }')
            LINE="Coverage: ${PCT}% (${LH} / ${LF} lines)"
          fi
          echo "$LINE"
          {
            echo "## Test coverage"
            echo ""
            echo "**${LINE}**"
            echo ""
            echo "_CI-scoped: \`test/services/\` + \`test/features/\` + \`test/release_gate/\` + \`test/data/\` + \`test/scripts/\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Exclude .g.dart files — they're auto-generated by build_runner
      # and the formatter rules drift between Dart minor versions, so
      # locking them to one specific format would just churn on every
      # SDK bump. The hand-written sources in lib/ + test/ get the
      # full check.
      - name: Check formatting
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' -print0 \
            | xargs -0 dart format --set-exit-if-changed
