name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift schema + JSON serialization generated code (*.g.dart) is
      # gitignored locally — `flutter analyze` finds 455 errors without
      # it ("Undefined class 'UserStacksLocalData'", "ProductsCoreCompanion",
      # etc.). Run build_runner before analyze so CI matches the local
      # `make gen && make check` flow.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test test/services/ test/features/ test/release_gate/ test/data/

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/
