name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The catalog DBs (assets/db/*.db, *.sqlite) ship via Git LFS.
      # `lfs: true` here USED to be correct, but it makes checkout a
      # hard gate: when the LFS fetch fails the whole job dies before
      # analyze/test/format ever run, so every PR goes red for a reason
      # that has nothing to do with the code under review.
      #
      # That is exactly what happens today — the repo has blown past its
      # GitHub LFS budget ("This repository exceeded its LFS budget"),
      # which only the account owner can restore. A permanently red CI
      # masks real regressions, so checkout no longer depends on it.
      - uses: actions/checkout@v7
        with:
          lfs: false

      # Fetch the LFS objects best-effort and record whether we got them.
      # The tests that read the real bundle are tagged `bundle` (see
      # dart_test.yaml) and are excluded when the objects are
      # unavailable; analyze, format, and the rest of the suite run
      # either way. When the LFS budget is restored this step simply
      # succeeds and the bundle gates run again — no workflow change.
      - name: Fetch LFS objects (best effort)
        run: |
          git lfs install --local
          git lfs pull || true
          # Check the postcondition, not git-lfs's exit code: a real
          # SQLite file starts with "SQLite format 3", an unfetched LFS
          # pointer starts with "version https://git-lfs...".
          if head -c 15 assets/db/pharmaguide_core.db | grep -qa 'SQLite format'; then
            echo "EXCLUDE_TAGS=golden" >> "$GITHUB_ENV"
            echo "Git LFS objects materialized — bundle-dependent tests will run."
          else
            echo "EXCLUDE_TAGS=golden,bundle" >> "$GITHUB_ENV"
            echo "::warning title=Git LFS unavailable::Could not fetch assets/db LFS objects (LFS budget exceeded). Bundle-dependent release gates were SKIPPED, not verified."
            {
              echo "## ⚠️ Bundle release gates skipped"
              echo ""
              echo "Git LFS objects for \`assets/db/\` could not be fetched, so tests tagged"
              echo "\`bundle\` did not run. **This job passing does not mean the shipped"
              echo "catalog was verified.** Restore the repo's LFS budget to re-enable them."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift schema + JSON serialization generated code (*.g.dart) is
      # gitignored locally — `flutter analyze` finds 455 errors without
      # it ("Undefined class 'UserStacksLocalData'", "ProductsCoreCompanion",
      # etc.). Run build_runner before analyze so CI matches the local
      # `make gen && make check` flow.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests (with coverage)
        # Runs every test directory except test/fixtures/ (test data,
        # not tests). Golden tests in test/core/widgets/goldens/ are
        # excluded via --exclude-tags because font rendering differs
        # across platforms (Ubuntu CI vs macOS dev). $EXCLUDE_TAGS adds
        # `bundle` when the LFS step above could not materialize
        # assets/db — see that step for why.
        # --coverage writes coverage/lcov.info; the next step parses it.
        run: flutter test --coverage --exclude-tags "$EXCLUDE_TAGS" test/core/ test/services/ test/features/ test/release_gate/ test/data/ test/scripts/ test/safety_invariants/ test/safety/

      - name: Coverage summary
        # Parses coverage/lcov.info to compute line coverage across all
        # source files reported by flutter test. Surfaces as a GitHub
        # check-summary block (markdown) so the number is visible on
        # the PR without leaving a comment or pulling in codecov.
        # No install needed — awk + bash. PR 9 (CI hygiene).
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — tests may have failed before generating it."
            exit 0
          fi
          read -r LH LF <<< "$(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END    { print lh, lf }
          ' coverage/lcov.info)"
          if [ "$LF" -eq 0 ]; then
            PCT="n/a"
            LINE="Coverage: no lines reported in lcov.info"
          else
            PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { printf "%.1f", (lh/lf)*100 }')
            LINE="Coverage: ${PCT}% (${LH} / ${LF} lines)"
          fi
          echo "$LINE"
          {
            echo "## Test coverage"
            echo ""
            echo "**${LINE}**"
            echo ""
            echo "_CI-scoped: all test dirs except \`test/fixtures/\` (golden tests excluded via tag)._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Exclude .g.dart files — they're auto-generated by build_runner
      # and the formatter rules drift between Dart minor versions, so
      # locking them to one specific format would just churn on every
      # SDK bump. The hand-written sources in lib/ + test/ get the
      # full check.
      - name: Check formatting
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' -print0 \
            | xargs -0 dart format --set-exit-if-changed
