# Dependabot — automated dependency updates.
#
# Cadence: monthly. Weekly is too noisy for a small team and most
# Flutter package updates are non-security cosmetic bumps. Security
# updates fire out-of-cycle regardless of this schedule (Dependabot's
# default behavior — see "Configuration options" docs).
#
# Open-PR caps prevent the queue from being flooded if a popular
# dep ships a major bump that cascades.
#
# Added by PR 9 (CI hygiene). Initial cadence is conservative; tune
# upward if security advisories outpace the monthly window.

version: 2
updates:
  # Flutter / Dart packages (pubspec.yaml + pubspec.lock).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions (subosito/flutter-action, actions/checkout, etc.).
  # Lower cap because there are only ~3 actions in our workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
