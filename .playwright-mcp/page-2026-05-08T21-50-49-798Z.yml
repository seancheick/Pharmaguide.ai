          - heading "Your medication may be depleting nutrients. We catch it." [level=2] [ref=e78]
          - paragraph [ref=e79]: Many common prescriptions quietly draw down specific vitamins and minerals over months and years. Statins lower CoQ10. Metformin depletes B12 and folate. PPIs reduce magnesium and B12 absorption. We map every medication you add to the nutrients it's known to deplete — and surface what to consider replenishing.
