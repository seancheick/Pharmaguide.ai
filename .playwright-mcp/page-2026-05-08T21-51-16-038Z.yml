    - region "What your medication might be quietly depleting" [ref=e16]:
      - generic [ref=e18]:
        - link "Blog" [ref=e19] [cursor=pointer]:
          - /url: /blog
          - generic [ref=e20]: ←
          - text: Blog
        - paragraph [ref=e21]: Health Education
        - heading "What your medication might be quietly depleting" [level=1] [ref=e22]
        - paragraph [ref=e23]: Statins lower CoQ10. Metformin draws down B12 and folate. PPIs reduce magnesium absorption. Here's the cheat sheet for the most common prescriptions — and why your supplement stack should know about it.
        - generic [ref=e24]:
          - generic [ref=e25]: By Sean Cheick Baradji
          - generic [ref=e26]: ·
          - generic [ref=e27]: Reviewed by Dr. Pham L., PharmD
          - generic [ref=e28]: ·
          - time [ref=e29]: May 8, 2026
          - generic [ref=e30]: ·
          - generic [ref=e31]: 8 min read
    - region "Article body" [ref=e32]:
      - article [ref=e34]:
        - paragraph [ref=e35]:
          - text: If you take a daily prescription, there's a reasonable chance it's quietly drawing down a specific vitamin or mineral over months and years.
          - strong [ref=e36]: It's not a side effect in the dramatic sense.
          - text: You won't feel it the day you start the medication. You'll feel it eight months in, when your energy isn't quite what it used to be, or your hair is thinner, or your sleep is off — and you'll blame anything
          - emphasis [ref=e37]: but
          - text: the prescription that's been working perfectly to manage what it was prescribed for.
        - paragraph [ref=e38]:
          - text: This is the gap most people miss. The prescription is doing its job.
          - emphasis [ref=e39]: And
          - text: it's depleting something. Both can be true.
        - paragraph [ref=e40]:
          - text: "The good news: this is well-documented in pharmacology. The depletion patterns for the most common medications are mapped, the mechanisms are understood, and the replenishment options are simple. It's just that nobody routinely tells you about them at the pharmacy counter — partly because there isn't time in a 7-minute primary care visit, and partly because the depletion is slow enough that it's nobody's"
          - emphasis [ref=e41]: acute
          - text: problem.
        - paragraph [ref=e42]:
          - text: This guide walks through five of the most common medication classes and the nutrients they affect.
          - strong [ref=e43]: The point isn't to scare you off your prescription.
          - text: The point is to know what to ask your doctor or pharmacist about, and to think about your supplement stack with the depletion in mind rather than ignoring it.
        - heading "A note on what this is and isn't" [level=2] [ref=e44]
        - complementary [ref=e45]:
          - paragraph [ref=e46]:
            - text: This is
            - strong [ref=e47]: educational information
            - text: ", not medical advice. The depletion patterns described are well-established in clinical pharmacology, but specific dosing and timing decisions should always involve your healthcare provider — especially because depletion severity varies by individual, dose, and duration."
        - paragraph [ref=e48]: "If you're taking any of the medications below and want to discuss replenishment, the conversation with your clinician is short: \"I read that this medication can reduce levels of [nutrient]. Should I be supplementing, or should we test my levels?\" That's it. They'll know."
        - heading "1. Statins → CoQ10" [level=2] [ref=e49]
        - paragraph [ref=e50]:
          - text: "Statins (atorvastatin, simvastatin, rosuvastatin, pravastatin) work by inhibiting an enzyme called HMG-CoA reductase, which the liver uses to make cholesterol. The catch: that same enzyme is upstream of the body's production of"
          - link "coenzyme Q10" [ref=e51] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/CoenzymeQ10-HealthProfessional/
          - text: ", a critical molecule in cellular energy production. Block the cholesterol pathway, and you also dial down CoQ10 synthesis."
        - paragraph [ref=e52]:
          - strong [ref=e53]: Why it matters.
          - text: CoQ10 is concentrated in tissues that work hardest — heart, skeletal muscle, brain, kidneys. The clinical signal that overlaps with statin-related muscle complaints (myalgia, weakness, fatigue) has been studied for two decades. The literature is mixed on whether CoQ10 supplementation reliably
          - emphasis [ref=e54]: reverses
          - text: statin-associated muscle symptoms in everyone, but the depletion itself is well-documented.
        - paragraph [ref=e55]:
          - strong [ref=e56]: Common context.
          - text: Some cardiology guidelines now mention CoQ10 supplementation as a discussion point for patients on long-term high-dose statins, especially those reporting muscle symptoms.
        - paragraph [ref=e57]:
          - strong [ref=e58]: Typical replenishment.
          - text: 100–200 mg of CoQ10 (or its bioactive form, ubiquinol) daily, taken with a meal containing fat for absorption.
          - emphasis [ref=e59]: Discuss with your clinician.
        - paragraph [ref=e60]:
          - strong [ref=e61]: "Source:"
          - link "NIH Office of Dietary Supplements — CoQ10 fact sheet" [ref=e62] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/CoenzymeQ10-HealthProfessional/
        - heading "2. Metformin → Vitamin B12 and folate" [level=2] [ref=e63]
        - paragraph [ref=e64]:
          - text: Metformin is the most-prescribed first-line type-2 diabetes medication in the United States. It also has a well-documented effect on
          - link "vitamin B12 absorption" [ref=e65] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/
          - text: — specifically, it reduces the calcium-dependent uptake of B12 in the small intestine. Long-term users (think years, not months) develop measurable B12 deficiencies more frequently than people not on metformin.
        - paragraph [ref=e66]: Folate (vitamin B9) often follows the same pattern, though by a different mechanism.
        - paragraph [ref=e67]:
          - strong [ref=e68]: Why it matters.
          - text: "B12 deficiency presents as fatigue, neuropathy (tingling in feet and hands), cognitive fog, and in advanced cases anemia. The cruel irony: peripheral neuropathy from B12 deficiency can be misattributed to diabetes itself, since diabetic neuropathy presents similarly. This is why some endocrinologists routinely test B12 levels in long-term metformin patients."
        - paragraph [ref=e69]:
          - strong [ref=e70]: Typical replenishment.
          - text: Methylcobalamin (the bioactive form of B12) at 500–1,000 mcg daily, often paired with methylfolate.
          - emphasis [ref=e71]: If you're on metformin and haven't had B12 levels checked in 2+ years, that's the conversation.
        - paragraph [ref=e72]:
          - strong [ref=e73]: "Source:"
          - link "DailyMed — Metformin labeling" [ref=e74] [cursor=pointer]:
            - /url: https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=metformin
          - text: ·
          - link "NIH ODS — Vitamin B12" [ref=e75] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/
        - heading "3. PPIs → Magnesium, B12, calcium" [level=2] [ref=e76]
        - paragraph [ref=e77]:
          - text: Proton pump inhibitors — omeprazole, pantoprazole, esomeprazole, lansoprazole — suppress stomach acid production. That's the entire point; they treat reflux, ulcers, and esophageal irritation by reducing acid.
          - strong [ref=e78]: The trade-off
          - text: "is that several nutrients require gastric acid for absorption: vitamin B12 (released from food protein by acid),"
          - link "magnesium" [ref=e79] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/
          - text: (acid-dependent uptake), and calcium (acid-soluble forms).
        - paragraph [ref=e80]:
          - strong [ref=e81]: Why it matters.
          - text: Long-term PPI use has been associated in clinical literature with magnesium deficiency, B12 deficiency, and a measurable shift in calcium absorption. The FDA has issued specific safety communications about PPI-related magnesium deficiency for users on these medications more than a year.
        - paragraph [ref=e82]:
          - strong [ref=e83]: Common context.
          - text: PPIs are some of the most over-prescribed medications in modern medicine; many people take them for years for symptoms that could be addressed at the lifestyle level. If you're on a PPI long-term, the conversation with your clinician about whether you still need it is worth having — separate from the depletion question.
        - paragraph [ref=e84]:
          - strong [ref=e85]: Typical replenishment.
          - text: Magnesium glycinate 200–400 mg, B12 (see above), and calcium citrate (the form that doesn't require acid for absorption) if dietary intake is low.
        - paragraph [ref=e86]:
          - strong [ref=e87]: "Source:"
          - 'link "FDA Safety Communication: PPIs and low magnesium" [ref=e88] [cursor=pointer]':
            - /url: https://www.fda.gov/drugs/drug-safety-and-availability
          - text: ·
          - link "NIH ODS — Magnesium" [ref=e89] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/
        - heading "4. Loop and thiazide diuretics → Potassium, magnesium, thiamine" [level=2] [ref=e90]
        - paragraph [ref=e91]: Loop diuretics (furosemide, torsemide, bumetanide) and thiazide diuretics (hydrochlorothiazide, chlorthalidone) are workhorses in hypertension and heart failure management. They work by promoting urinary excretion of sodium and water — and several other nutrients are excreted along with the sodium, including potassium, magnesium, and thiamine (vitamin B1).
        - paragraph [ref=e92]:
          - strong [ref=e93]: Why it matters.
          - text: Potassium depletion is the most clinically dangerous because it can affect heart rhythm; this is why many people on loop diuretics are also told to take a potassium supplement or are prescribed a "potassium-sparing" diuretic alongside. Magnesium depletion is also common but routinely under-screened. Thiamine deficiency from chronic diuretic use is documented enough that some heart-failure guidelines specifically address it.
        - paragraph [ref=e94]:
          - strong [ref=e95]: Typical replenishment.
          - text: Driven by your clinician based on labs — potassium and magnesium especially shouldn't be self-supplemented in significant amounts when you're on a diuretic. Thiamine replenishment is generally safer to discuss casually.
        - paragraph [ref=e96]:
          - strong [ref=e97]: "Source:"
          - link "NIH ODS — Magnesium, Potassium fact sheets" [ref=e98] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/
          - text: ·
          - link "DailyMed — diuretic labeling" [ref=e99] [cursor=pointer]:
            - /url: https://dailymed.nlm.nih.gov/
        - heading "5. Combined oral contraceptives → B-complex, folate, magnesium" [level=2] [ref=e100]
        - paragraph [ref=e101]: Combined oral contraceptives (the "pill") contain estrogen plus a progestin and have been associated in clinical literature with reduced levels of several B vitamins (especially folate, B6, B12, and riboflavin), and sometimes magnesium and zinc. The mechanisms are partly metabolic — estrogen affects the liver enzymes that handle some of these nutrients — and partly absorption-related.
        - paragraph [ref=e102]:
          - strong [ref=e103]: Why it matters.
          - text: Folate is the most clinically meaningful, especially for anyone who might become pregnant — folate deficiency in early pregnancy (often before pregnancy is recognized) is the textbook risk factor for neural tube defects. This is part of why prenatal vitamins exist and why many family-medicine guidelines recommend folate supplementation in women of reproductive age, regardless of contraception status.
        - paragraph [ref=e104]:
          - strong [ref=e105]: Typical replenishment.
          - text: A B-complex with active folate (5-MTHF, not the synthetic folic acid form for those with MTHFR variants), magnesium glycinate, and adequate dietary protein.
        - paragraph [ref=e106]:
          - strong [ref=e107]: "Source:"
          - link "PubMed — oral contraceptives and B vitamins" [ref=e108] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=oral+contraceptive+B+vitamin+depletion
          - text: ·
          - link "NIH ODS — Folate" [ref=e109] [cursor=pointer]:
            - /url: https://ods.od.nih.gov/factsheets/Folate-HealthProfessional/
        - heading "What to actually do with all this" [level=2] [ref=e110]
        - paragraph [ref=e111]: "Three takeaways:"
        - paragraph [ref=e112]:
          - strong [ref=e113]: 1. If you take any of these medications long-term, get your levels checked.
          - text: B12, vitamin D, magnesium, ferritin (iron stores), and basic electrolytes are inexpensive blood tests. Most insurance plans cover them. Your doctor can run them at your next visit if you ask.
        - paragraph [ref=e114]:
          - strong [ref=e115]: 2. Don't self-supplement potassium or aggressively self-supplement magnesium if you're on a diuretic.
          - text: Those are conversations with your clinician — the wrong dose can cause arrhythmias.
        - paragraph [ref=e116]:
          - strong [ref=e117]: 3. For the others (B12 with metformin, CoQ10 with statins, B-complex with the pill), supplementation is generally low-risk and worth a conversation with your pharmacist.
          - text: Most pharmacists will give you a straight answer in five minutes if you ask at the counter.
        - paragraph [ref=e118]: This is exactly the kind of cross-checking PharmaGuide does automatically when you add a medication to your stack — it surfaces the depletion patterns and recommends replenishment options, all reviewed by a licensed pharmacist before they ship.
        - complementary [ref=e119]:
          - paragraph [ref=e120]:
            - strong [ref=e121]: Reading this on PharmaGuide.io?
            - text: When you join the beta, every medication you add prompts a depletion check — including the patterns above and many more (proton pump inhibitors and B12, ACE inhibitors and zinc, methotrexate and folate, the long tail).
          - paragraph [ref=e122]:
            - link "Join the beta →" [ref=e123] [cursor=pointer]:
              - /url: /#waitlist
